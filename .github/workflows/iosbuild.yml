name: iOS Custom Cloud Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # 文字化けを防ぐため、ジョブ名から日本語を完全に排除
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install CocoaPods
        run: |
          pod install

      # PodsプロジェクトのiOSターゲットを一括で13.0に引き上げる
      - name: Force Pods Compatibility to modern iOS
        run: |
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' Pods/Pods.xcodeproj/project.pbxproj
          fi

      # ワークスペース名とスキーム名を自動検出してビルドを実行（文字化け対策）
      - name: Build Application
        run: |
          WORKSPACE_FILE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          
          echo "Detected Workspace: $WORKSPACE_FILE"
          echo "Detected Scheme: $SCHEME_NAME"
          
          xcodebuild build \
                     -workspace "$WORKSPACE_FILE" \
                     -scheme "$SCHEME_NAME" \
                     -sdk iphonesimulator \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
                     SWIFT_COMPILATION_MODE=wholemodule \
                     ONLY_ACTIVE_ARCH=YES
