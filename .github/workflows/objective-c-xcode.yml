      - name: Install CocoaPods
        run: |
          pod install

      # 👇 ここから上書き追加：Pods全体の古いターゲット設定を一括でiOS 13に書き換える
      - name: Force Pods Compatibility to modern iOS
        run: |
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            echo "Updating Pods deployment target..."
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' Pods/Pods.xcodeproj/project.pbxproj
          else
            echo "Pods project not found, skipping."
          fi

      - name: Build Application
        run: |
          xcodebuild build \
                     -workspace "体当たりゲーム.xcworkspace" \
                     -scheme "体当たりゲーム" \
                     -sdk iphonesimulator \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
